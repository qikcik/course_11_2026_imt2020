gnb_id: 411
gnb_id_bit_length: 22


cu_cp:
  amf:
    addrs: 127.0.0.5
    port: 38412
    bind_addrs: 127.0.0.100
    supported_tracking_areas:
      - tac: 1
        plmn_list:
          - plmn: "99970"
            tai_slice_support_list:
              - sst: 1
  mobility:
    cells:
      - nr_cell_id: 0x00066C000
        periodic_report_cfg_id: 1
        ncells:
          - nr_cell_id: 0x000670000
            report_configs: [2]

      - nr_cell_id: 0x000670000
        gnb_id_bit_length: 22
        pci: 2
        plmn: "99970"
        tac: 1
        band: 3
        ssb_arfcn: 370000
        ssb_scs: 15
        ssb_period: 10
        ssb_offset: 0
        ssb_duration: 1

    report_configs:
      - report_cfg_id: 1
        report_type: periodical
        report_interval_ms: 1024
      - report_cfg_id: 2
        report_type: event_triggered
        event_triggered_report_type: a3
        meas_trigger_quantity: rsrp
        meas_trigger_quantity_offset_db: 3
        hysteresis_db: 0
        time_to_trigger_ms: 320

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://*:2000,rx_port=tcp://localhost:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 0.0
  rx_gain: 0.0

cell_cfg:
  pci: 1
  sector_id: 0
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "99970"
  tac: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 6
  prach:
    prach_config_index: 1
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: ./current/log/gnb.log
  all_level: info
  broadcast_enabled: true

pcap:
  mac_enable: false
  mac_filename: ./current/pcap/gnb_mac.pcap
  rlc_enable: false
  rlc_filename: ./current/pcap/gnb_rlc.pcap
  rlc_rb_type: all
  f1ap_enable: true
  f1ap_filename: ./current/pcap/gnb_f1ap.pcap
  e1ap_enable: false
  e1ap_filename: ./current/pcap/gnb_e1ap.pcap
  ngap_enable: false
  ngap_filename: ./current/pcap/gnb_ngap.pcap
  n3_enable: false
  n3_filename: ./current/pcap/gnb_n3_gtpu.pcap
